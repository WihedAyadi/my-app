name: Docker CI

on:
  Push:
    branches:
      - main
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t myapp .
      - name: Run Docker Container
        run: docker run -d -p 8080:80 myapp
      - name: Verify Container
        run: docker ps
